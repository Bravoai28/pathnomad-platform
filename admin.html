<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F4F1ED">
    <title>PATH NOMAD • Admin</title>
    <link rel="icon" type="image/jpeg" href="assets/logo-full.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/editorial.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header app-header">
        <div class="site-header__inner">
            <ul class="nav-list">
                <li><a class="nav-link" href="index.html">← <span class="hide-sm">Back to site</span></a></li>
            </ul>
            <a class="brand" href="index.html" aria-label="PATH NOMAD — home"><img src="assets/logo-wordmark.jpg" alt="PATH NOMAD" width="647" height="89"></a>
            <ul class="nav-list nav-list--right">
                <li><span class="meta">Admin<span class="hide-sm"> — Applications</span></span></li>
            </ul>
        </div>
    </header>

    <main id="main" class="wrap section">
        <div id="login-panel" class="read center" style="max-width:24rem">
            <p class="meta">Restricted</p>
            <h1 class="display mt-s" style="font-size:clamp(2.4rem,5vw,3.5rem)">Admin sign in</h1>
            <form id="admin-form" class="form-stack mt-l" style="text-align:left">
                <div class="field">
                    <label for="admin-pin">Admin PIN</label>
                    <input class="input" type="password" id="admin-pin" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn--block">Enter</button>
            </form>
            <p class="meta mt-l">Default PIN: pathnomad-admin-2026</p>
            <p class="meta mt-s"><a href="index.html">← Back to site</a></p>
        </div>

        <div id="dashboard" hidden>
            <div class="pair-width" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1.5rem;margin-bottom:2.5rem">
                <div>
                    <p class="meta">Creative Nomads</p>
                    <h1 class="h2 mt-s">Pending applications</h1>
                    <p class="mt-s" style="color:var(--ink-soft)">Approve to issue portal access code</p>
                </div>
                <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                    <a href="portal.html" class="btn btn--ghost btn--small">Member portal</a>
                    <button type="button" id="admin-logout" class="btn btn--ghost btn--small">Sign out</button>
                </div>
            </div>

            <div id="apps-list" class="pair-width" style="border-top:1px solid var(--rule-strong)"></div>

            <section class="pair-width mt-xl" aria-labelledby="members-h">
                <h2 class="h3" id="members-h" style="margin-bottom:1.5rem">Approved members</h2>
                <div id="members-list" style="border-top:1px solid var(--rule-strong)"></div>
            </section>
        </div>
    </main>

    <script src="js/pathnomad-members.js"></script>
    <script src="js/site.js"></script>
    <script>
        // Escape user-submitted values before inserting them into markup.
        const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '';

        function toast(msg, isCode) {
            if (isCode) PNToast('Share this access code with the member for portal login.', { title: 'Approved', code: msg, duration: 10000 });
            else PNToast(msg);
        }

        document.getElementById('admin-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const r = PathNomadMembers.adminLogin(document.getElementById('admin-pin').value.trim());
            if (!r.ok) { toast(r.error); return; }
            showDashboard();
        });

        document.getElementById('admin-logout').addEventListener('click', function () {
            PathNomadMembers.adminLogout();
            document.getElementById('login-panel').hidden = false;
            document.getElementById('dashboard').hidden = true;
        });

        function showDashboard() {
            document.getElementById('login-panel').hidden = true;
            document.getElementById('dashboard').hidden = false;
            render();
        }

        function render() {
            const apps = PathNomadMembers.getApplications();
            const pending = apps.filter(a => a.status === 'pending');
            const list = document.getElementById('apps-list');

            if (!pending.length) {
                list.innerHTML = '<p class="empty" style="border-top:0">No pending applications.</p>';
            } else {
                list.innerHTML = pending.map(app => {
                    const url = safeUrl(app.portfolio);
                    return `
                    <article class="app-row">
                        <div>
                            <h3 class="h3" style="font-size:1.5rem">${esc(app.name)}</h3>
                            <p style="color:var(--ink-soft)">${esc(app.email)}</p>
                            <p class="meta mt-s">${esc(app.discipline)} · ${esc(app.location)} · ${app.billing === 'annual' ? 'R3,500/yr' : 'R350/mo'}</p>
                            ${url ? `<p class="meta"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Portfolio →</a></p>` : ''}
                            <p class="meta">Applied ${esc(new Date(app.createdAt).toLocaleDateString())}</p>
                        </div>
                        <div class="app-row__actions">
                            <button type="button" class="btn btn--small" data-approve="${esc(app.id)}">Approve</button>
                            <button type="button" class="btn btn--ghost btn--small" data-reject="${esc(app.id)}">Reject</button>
                        </div>
                    </article>`;
                }).join('');
            }

            const members = PathNomadMembers.getMembers();
            document.getElementById('members-list').innerHTML = members.length
                ? members.map(m => `
                    <div class="app-row">
                        <div>
                            <p style="font-weight:400">${esc(m.name)}</p>
                            <p class="meta">${esc(m.email)} · Code: <span style="color:var(--ink);letter-spacing:.12em">${esc(m.accessCode)}</span></p>
                        </div>
                        <button type="button" class="btn btn--ghost btn--small" data-revoke="${esc(m.email)}">Revoke</button>
                    </div>
                `).join('')
                : '<p class="empty" style="border-top:0">No approved members yet.</p>';
        }

        document.getElementById('dashboard').addEventListener('click', function (e) {
            const a = e.target.closest('[data-approve]');
            const rj = e.target.closest('[data-reject]');
            const rv = e.target.closest('[data-revoke]');
            if (a) {
                const r = PathNomadMembers.approveApplication(a.dataset.approve);
                if (!r.ok) { toast(r.error); return; }
                toast(r.accessCode, true);
                render();
            } else if (rj) {
                const r = PathNomadMembers.rejectApplication(rj.dataset.reject);
                if (!r.ok) { toast(r.error); return; }
                toast('Application rejected.');
                render();
            } else if (rv) {
                if (!confirm('Revoke this member\'s portal access?')) return;
                PathNomadMembers.revokeMember(rv.dataset.revoke);
                toast('Member access revoked.');
                render();
            }
        });

        if (PathNomadMembers.isAdminLoggedIn()) showDashboard();
    </script>
</body>
</html>
